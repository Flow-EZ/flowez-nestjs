name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - redis
          - minio
          - all
      release:
        description: 'alpha/beta/rc = prerelease; patch/minor/major = stable latest'
        required: true
        type: choice
        default: rc
        options:
          - alpha
          - beta
          - rc
          - patch
          - minor
          - major

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CI: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump, build, publish
        env:
          PACKAGE: ${{ inputs.package }}
          RELEASE: ${{ inputs.release }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          case "${RELEASE}" in
            alpha|beta|rc)
              BUMP=prerelease
              PREID="${RELEASE}"
              TAG="${RELEASE}"
              ;;
            patch|minor|major)
              BUMP="${RELEASE}"
              PREID=
              TAG=latest
              ;;
            *)
              echo "::error::unknown release ${RELEASE}"
              exit 1
              ;;
          esac

          read_pkg() {
            node -p "JSON.parse(require('fs').readFileSync('$1','utf8')).$2"
          }

          bump_pkg() {
            local dir="$1"
            local pkg="packages/${dir}/package.json"
            local before name version
            before="$(read_pkg "${pkg}" version)"
            if [ "${BUMP}" = 'prerelease' ]; then
              pnpm --filter "./packages/${dir}" version prerelease --preid="${PREID}" --no-git-tag-version
            else
              pnpm --filter "./packages/${dir}" version "${BUMP}" --no-git-tag-version
            fi
            name="$(read_pkg "${pkg}" name)"
            version="$(read_pkg "${pkg}" version)"
            if [ "${before}" = "${version}" ]; then
              echo "::error::${name} version did not change (${version})"
              exit 1
            fi
            echo "${dir} ${name} ${version}"
          }

          dirs=()
          if [ "${PACKAGE}" = 'redis' ] || [ "${PACKAGE}" = 'all' ]; then
            dirs+=('redis')
          fi
          if [ "${PACKAGE}" = 'minio' ] || [ "${PACKAGE}" = 'all' ]; then
            dirs+=('minio')
          fi

          bumped=()
          for dir in "${dirs[@]}"; then
            bumped+=("$(bump_pkg "${dir}")")
          done

          pnpm build

          published=()
          failed=0
          for entry in "${bumped[@]}"; do
            dir="${entry%% *}"
            rest="${entry#* }"
            name="${rest%% *}"
            version="${rest#* }"
            if pnpm --filter "./packages/${dir}" publish --access public --tag "${TAG}" --no-git-checks --provenance; then
              published+=("${name}@${version}")
              git add "packages/${dir}/package.json"
            else
              echo "::error::failed to publish ${name}@${version}"
              git checkout -- "packages/${dir}/package.json"
              failed=1
            fi
          done

          if [ ${#published[@]} -gt 0 ]; then
            git commit --no-verify -m "chore: release ${published[*]}"
            git push origin "HEAD:${BRANCH}"
          fi

          exit "${failed}"
